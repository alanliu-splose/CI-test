name: "Issue · 1 Prepare → Staging → open issue"

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Optional comma list (server,frontend,public-api). Blank = from the diff.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    with:
      services: ${{ inputs.services }}

  open-issue:
    name: Open release issue
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BASE: ${{ needs.prepare.outputs.base }}
          SERVICES: ${{ needs.prepare.outputs.services }}
        run: |
          json=$(jq -cn --arg commit "$COMMIT" --arg base "$BASE" --arg services "$SERVICES" '{commit:$commit, base:$base, services:$services}')
          body=$(cat <<MD
          | param | value |
          |---|---|
          | commit | \`$COMMIT\` |
          | base | \`$BASE\` |
          | services | \`$SERVICES\` |

          - [x] Prepare · Staging + red-devil ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))
          - [ ] QA approve → Demo: comment \`/qa-approve\`
          - [ ] Eng approve → Prod: comment \`/eng-approve\`

          <!-- release:$json -->
          MD
          )
          url=$(gh issue create --title "Release ${COMMIT:0:7}" --label release --body "$body")
          echo "### Next: QA comments \`/qa-approve\` on $url" >> "$GITHUB_STEP_SUMMARY"
