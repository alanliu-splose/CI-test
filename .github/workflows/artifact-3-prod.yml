name: "Artifact · 3 Eng approve → Prod"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID'
        required: false
        default: ''
      imports_running:
        description: 'Simulate pre-flight check fails'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

concurrency:
  group: prod
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  load:
    name: Load release
    runs-on: ubuntu-26.04
    outputs:
      run_id: ${{ steps.r.outputs.run_id }}
      commit: ${{ steps.r.outputs.commit }}
      base: ${{ steps.r.outputs.base }}
      services: ${{ steps.r.outputs.services }}
    steps:
      - id: r
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -w artifact-2-demo.yml -s success -L 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$RUN_ID" ] || { echo "::error::No successful Artifact · 2 run yet"; exit 1; }
            say "Run ID blank -> latest successful Artifact · 2 run: $RUN_ID"
          fi
          gh run download "$RUN_ID" -n release
          stage=$(jq -r .stage release.json)
          [ "$stage" = demo ] || { echo "::error::run $RUN_ID is at stage '$stage', expected demo: prod needs a Demo run, so QA approve can't be skipped"; exit 1; }
          say "Release from run $RUN_ID"
          say "  stage     $stage"
          say "  commit    $(jq -r .commit release.json)"
          say "  base      $(jq -r .base release.json)"
          say "  services  $(jq -r '.services|gsub(",";", ")' release.json)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          for k in commit base services; do echo "$k=$(jq -r .$k release.json)" >> "$GITHUB_OUTPUT"; done

  approve:
    name: Eng approve
    needs: load
    runs-on: ubuntu-26.04
    steps:
      - run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          say "Approved by ${{ github.actor }} (ran this workflow)"

  eb-health:
    name: "Check: EB health"
    needs: approve
    runs-on: ubuntu-26.04
    steps:
      - run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          for region in AU UK; do say "describe-environment-health splose-production-server-22 $region (simulated) -> Ok"; done

  imports:
    name: "Check: running imports"
    needs: eb-health
    runs-on: ubuntu-26.04
    steps:
      - env:
          IMPORTS_RUNNING: ${{ inputs.imports_running }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ "$IMPORTS_RUNNING" = true ]; then n=3; else n=0; fi
          say "GET admin portal /running-imports with the secret key (simulated) -> $n processing"
          if [ "$n" -gt 0 ]; then
            say "Run stops: prod untouched. Ship the fix with Prod Hotfix."
            echo "::error title=Imports running::$n imports processing. Run stops: prod untouched. Ship the fix with Prod Hotfix."
            exit 1
          fi
          say "No import processing -> continue"

  notify-started:
    name: Notify prod started
    needs: [load, imports]
    runs-on: ubuntu-26.04
    steps:
      - env:
          COMMIT: ${{ needs.load.outputs.commit }}
          SERVICES: ${{ needs.load.outputs.services }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          say "Slack #deployments (simulated)"
          say "@engineers @qa Prod deploy started: ${COMMIT:0:7} (${SERVICES//,/, }), approved by $GITHUB_ACTOR."

  tofu-apply:
    name: Tofu apply
    needs: notify-started
    runs-on: ubuntu-26.04
    steps:
      - run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          for ws in production-au-splose production-uk-splose production-au production-uk; do
            say "tofu apply $ws (simulated) -> no changes"
          done

  db-migrator:
    name: db-migrator (${{ matrix.region }})
    needs: [load, tofu-apply]
    if: contains(needs.load.outputs.services, 'server')
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        region: [AU, UK]
    steps:
      - run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          say "db-migrator Fargate task ${{ matrix.region }} (simulated) -> migrations up to date"

  prod:
    name: Prod (${{ matrix.region }})
    needs: [load, tofu-apply, db-migrator]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        region: [AU, UK]
    steps:
      - env:
          SERVICES: ${{ needs.load.outputs.services }}
          COMMIT: ${{ needs.load.outputs.commit }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          for s in ${SERVICES//,/ }; do say "Deploy $s ${COMMIT:0:7} to prod ${{ matrix.region }} (simulated) -> done"; done

  verify:
    name: Verify
    needs: [load, prod]
    runs-on: ubuntu-26.04
    steps:
      - env:
          COMMIT: ${{ needs.load.outputs.commit }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          for region in AU UK; do
            say "Smoke tests $region-prod (simulated) -> passed"
            say "Health-check $region (simulated) -> commit $COMMIT = head ✓"
          done
          say "Errors 15 min before / after (simulated) -> 12 / 11, no spike"

  notify-succeeded:
    name: Notify prod succeeded
    needs: [load, verify]
    runs-on: ubuntu-26.04
    steps:
      - env:
          COMMIT: ${{ needs.load.outputs.commit }}
          BASE: ${{ needs.load.outputs.base }}
          SERVICES: ${{ needs.load.outputs.services }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          say "Slack #deployments (simulated)"
          say "@engineers @qa Prod deploy succeeded: ${BASE:0:7}..${COMMIT:0:7} (${SERVICES//,/, }). AU and UK verified."
