name: Prod (called)

on:
  workflow_call:
    inputs:
      commit: {type: string, required: true}
      base: {type: string, required: true}
      services: {type: string, required: true}

jobs:
  checks:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    steps:
      - name: EB health
        run: echo "EB environments healthy in AU and UK (simulated)"
      # Simulated: no endpoint or secret yet. Set the repo variable RUNNING_IMPORTS above 0 to see a failure.
      - name: Running imports
        env:
          RUNNING_IMPORTS: ${{ vars.RUNNING_IMPORTS || '0' }}
        run: |
          echo "GET admin portal /running-imports with the secret key (simulated) -> $RUNNING_IMPORTS running"
          if [ "$RUNNING_IMPORTS" -gt 0 ]; then
            echo "::error title=Imports running::$RUNNING_IMPORTS imports running. Run stops: prod untouched. Ship the fix with Prod Hotfix."
            echo "### ❌ Pre-flight failed: $RUNNING_IMPORTS imports running. Prod untouched. Ship the fix with Prod Hotfix." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ Pre-flight passed: no imports running" >> "$GITHUB_STEP_SUMMARY"

  tofu-apply:
    name: Tofu apply
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Slack: Prod deploy started (simulated)"
          echo "Tofu apply ${{ inputs.commit }} (simulated)"

  db-migrator:
    name: db-migrator ${{ matrix.region }}
    needs: tofu-apply
    if: contains(inputs.services, 'server')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [AU, UK]
    steps:
      - run: echo "db-migrator ${{ inputs.commit }} in ${{ matrix.region }} (simulated)"

  prod:
    name: Prod ${{ matrix.region }}
    needs: [tofu-apply, db-migrator]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [AU, UK]
    steps:
      - env:
          SERVICES: ${{ inputs.services }}
        run: |
          for s in ${SERVICES//,/ }; do
            echo "Deploy $s @ ${{ inputs.commit }} to ${{ matrix.region }} prod (simulated)"
          done

  verify:
    name: Verify
    needs: prod
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Smoke tests AU-prod, UK-prod: passed (simulated)"
          echo "Health-check reports ${{ inputs.commit }} (simulated)"
          echo "No error spike (simulated)"

  notify:
    name: Notify
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Slack: Prod deploy succeeded ${{ inputs.base }}..${{ inputs.commit }} services=${{ inputs.services }} (simulated)"
          echo "### ✅ Prod deployed \`${{ inputs.commit }}\` · ${{ inputs.services }}" >> "$GITHUB_STEP_SUMMARY"
