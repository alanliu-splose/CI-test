name: "Artifact · 3 Eng approve → Prod"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID'
        required: false
        default: ''
      imports_running:
        description: 'Simulate pre-flight check fails'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: prod
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  load:
    name: Load release
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.r.outputs.run_id }}
      commit: ${{ steps.r.outputs.commit }}
      base: ${{ steps.r.outputs.base }}
      services: ${{ steps.r.outputs.services }}
    steps:
      - id: r
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -w artifact-2-demo.yml -s success -L 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$RUN_ID" ] || { echo "::error::No successful Artifact · 2 run yet"; exit 1; }
            echo "Run ID blank -> latest successful Artifact · 2 run: $RUN_ID"
          fi
          gh run download "$RUN_ID" -n release
          stage=$(jq -r .stage release.json)
          [ "$stage" = demo ] || { echo "::error::run $RUN_ID is at stage '$stage', expected demo: prod needs a Demo run, so QA approve can't be skipped"; exit 1; }
          echo "Release from run $RUN_ID"
          echo "  stage     $stage"
          echo "  commit    $(jq -r .commit release.json)"
          echo "  base      $(jq -r .base release.json)"
          echo "  services  $(jq -r '.services|gsub(",";", ")' release.json)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          for k in commit base services; do echo "$k=$(jq -r .$k release.json)" >> "$GITHUB_OUTPUT"; done

  approve:
    name: Eng approve
    needs: load
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approved by ${{ github.actor }} (ran this workflow)"

  eb-health:
    name: "Check: EB health"
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - run: |
          for region in AU UK; do echo "describe-environment-health splose-production-server-22 $region (simulated) -> Ok"; done

  imports:
    name: "Check: running imports"
    needs: eb-health
    runs-on: ubuntu-latest
    steps:
      - env:
          IMPORTS_RUNNING: ${{ inputs.imports_running }}
        run: |
          if [ "$IMPORTS_RUNNING" = true ]; then n=3; else n=0; fi
          echo "GET admin portal /running-imports with the secret key (simulated) -> $n processing"
          if [ "$n" -gt 0 ]; then
            echo "::error title=Imports running::$n imports processing. Run stops: prod untouched. Ship the fix with Prod Hotfix."
            echo "### ❌ Stopped at pre-flight: $n imports processing. Prod untouched. Ship the fix with Prod Hotfix." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No import processing -> continue"

  notify-started:
    name: Notify started
    needs: [load, imports]
    runs-on: ubuntu-latest
    steps:
      - env:
          COMMIT: ${{ needs.load.outputs.commit }}
        run: |
          echo "Slack #deployments (simulated): Prod deploy started ${COMMIT:0:7}"

  tofu-apply:
    name: Tofu apply
    needs: notify-started
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ws in production-au-splose production-uk-splose production-au production-uk; do
            echo "tofu apply $ws (simulated) -> no changes"
          done

  db-migrator:
    name: db-migrator (${{ matrix.region }})
    needs: [load, tofu-apply]
    if: contains(needs.load.outputs.services, 'server')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [AU, UK]
    steps:
      - run: echo "db-migrator Fargate task ${{ matrix.region }} (simulated) -> migrations up to date"

  prod:
    name: Prod (${{ matrix.region }})
    needs: [load, tofu-apply, db-migrator]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [AU, UK]
    steps:
      - env:
          SERVICES: ${{ needs.load.outputs.services }}
          COMMIT: ${{ needs.load.outputs.commit }}
        run: |
          for s in ${SERVICES//,/ }; do echo "Deploy $s ${COMMIT:0:7} to prod ${{ matrix.region }} (simulated) -> done"; done

  verify:
    name: Verify
    needs: [load, prod]
    runs-on: ubuntu-latest
    steps:
      - env:
          COMMIT: ${{ needs.load.outputs.commit }}
        run: |
          for region in AU UK; do
            echo "Smoke tests $region-prod (simulated) -> passed"
            echo "Health-check $region (simulated) -> commit $COMMIT = head ✓"
          done
          echo "Errors 15 min before / after (simulated) -> 12 / 11, no spike"

  notify-succeeded:
    name: Notify succeeded
    needs: [load, verify]
    runs-on: ubuntu-latest
    steps:
      - env:
          COMMIT: ${{ needs.load.outputs.commit }}
          BASE: ${{ needs.load.outputs.base }}
          SERVICES: ${{ needs.load.outputs.services }}
        run: |
          echo "Slack #deployments (simulated): Prod deploy succeeded"
          echo "  commit    $COMMIT"
          echo "  base      $BASE"
          echo "  services  ${SERVICES//,/, }"
          {
            echo "### ✅ Prod deployed"
            echo "- commit: \`$COMMIT\`"
            echo "- base: \`$BASE\`"
            echo "- services: ${SERVICES//,/, }"
          } >> "$GITHUB_STEP_SUMMARY"
