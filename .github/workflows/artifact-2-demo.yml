name: "Artifact · 2 QA approve → Demo"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID'
        required: false
        default: ''

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  load:
    name: Load release
    runs-on: ubuntu-26.04
    outputs:
      run_id: ${{ steps.r.outputs.run_id }}
      commit: ${{ steps.r.outputs.commit }}
      base: ${{ steps.r.outputs.base }}
      services: ${{ steps.r.outputs.services }}
    steps:
      - id: r
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -w artifact-1-prepare.yml -s success -L 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$RUN_ID" ] || { echo "::error::No successful Artifact · 1 run yet"; exit 1; }
            say "Run ID blank -> latest successful Artifact · 1 run: $RUN_ID"
          fi
          gh run download "$RUN_ID" -n release
          stage=$(jq -r .stage release.json)
          [ "$stage" = staging ] || { echo "::error::run $RUN_ID is at stage '$stage', expected staging"; exit 1; }
          say "Release from run $RUN_ID"
          say "  stage     $stage"
          say "  commit    $(jq -r .commit release.json)"
          say "  base      $(jq -r .base release.json)"
          say "  services  $(jq -r '.services|gsub(",";", ")' release.json)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          for k in commit base services; do echo "$k=$(jq -r .$k release.json)" >> "$GITHUB_OUTPUT"; done

  approve:
    name: QA approve
    needs: load
    runs-on: ubuntu-26.04
    steps:
      - run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          say "Approved by ${{ github.actor }} (ran this workflow)"

  demo:
    name: Demo (${{ matrix.region }})
    needs: [load, approve]
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        region: [AU, UK]
    steps:
      - env:
          SERVICES: ${{ needs.load.outputs.services }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          for s in ${SERVICES//,/ }; do say "Deploy $s to blue-bowtie ${{ matrix.region }} (simulated) -> done"; done

  demo-health:
    name: Demo health-check
    needs: [load, demo]
    runs-on: ubuntu-26.04
    steps:
      - env:
          COMMIT: ${{ needs.load.outputs.commit }}
        run: |
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          for region in AU UK; do say "blue-bowtie $region health-check (simulated) -> commit $COMMIT ✓"; done

  save:
    name: Save release.json
    needs: [load, demo-health]
    runs-on: ubuntu-26.04
    steps:
      - env:
          COMMIT: ${{ needs.load.outputs.commit }}
          BASE: ${{ needs.load.outputs.base }}
          SERVICES: ${{ needs.load.outputs.services }}
          PREPARE_RUN: ${{ needs.load.outputs.run_id }}
        run: |
          jq -n --arg commit "$COMMIT" --arg base "$BASE" --arg services "$SERVICES" --arg prep "$PREPARE_RUN" --arg run "$GITHUB_RUN_ID" \
            '{stage:"demo", commit:$commit, base:$base, services:$services, prepare_run:$prep, demo_run:$run}' > release.json
          jq . release.json
          printf '```json\n%s\n```\n' "$(jq . release.json)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.json
